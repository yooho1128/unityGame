<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그림자 극장 · 월드맵 아트 검수</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c101a;color:#eee5d0;font-family:system-ui,sans-serif}header,footer{padding:12px 20px;background:#171d29}h1{font-size:21px;margin:0 0 6px}p{margin:6px 0;font-size:14px;color:#c6c4bf}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{background:#2d3649;color:#fff;border:1px solid #667086;border-radius:5px;min-height:44px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{border-color:#f8c762;color:#f8c762}#viewport{overflow:auto;height:70vh;position:relative;overscroll-behavior:contain}#map{position:relative;min-width:100%;isolation:isolate}#art{display:block;width:100%;height:auto}#paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:none;width:130px;height:44px;z-index:2;font-size:28px;color:#fff;text-shadow:0 1px 4px #000}.pin span{position:absolute;top:39px;left:50%;transform:translateX(-50%);background:#111a;color:#fff;border:1px solid #d5b48188;padding:4px 6px;white-space:nowrap;border-radius:3px;font-size:12px}.pin.bottom span{top:auto;bottom:40px}.pin.selected{color:#ffd266}.pin.current{color:#63e1ff}.pin:focus-visible{outline:3px solid #ffd266}footer{min-height:90px}#error{color:#ffb3a7}a{color:#7ce0ff}
</style>
<header><h1>기억의 여정 · 그림형 월드맵</h1><p>아트 검수용 — 전체 63개 지역 공개. 게임 세이브·해금 상태와 무관합니다. Unity 실행 화면은 아닙니다.</p><nav id="pages" aria-label="지도 선택"></nav><nav><button id="out" aria-label="축소">−</button><button id="in" aria-label="확대">＋</button><button id="home">초기 위치</button><span id="scale"></span></nav><p id="error" role="alert"></p></header>
<main id="viewport"><div id="map"><img id="art" alt="지역별 풍경이 그려진 월드맵"><svg id="paths" aria-hidden="true"></svg><div id="pins"></div></div></main>
<footer><strong id="name">지역을 선택하세요</strong><p id="detail">핀을 누르면 지역 테마와 실제 연결 지역을 확인할 수 있습니다.</p><p>파란 표식: 검수 기준 시작점 · 금빛 점선: 카탈로그 연결 경로 (같은 지도 안의 구간)</p></footer>
<script>
'use strict';
const $=id=>document.getElementById(id);
let atlas,regions,page=0,zoom=1,selected='prologue_theater';
const start='prologue_theater';
function routeTo(id){const pending=[start],prev=new Map([[start,null]]);for(let i=0;i<pending.length;i++){const r=regions.find(x=>x.regionId===pending[i]);if(r.regionId===id){const path=[];for(let p=id;p!==null;p=prev.get(p))path.unshift(p);return path;}for(const n of r.connectedRegionIds||[])if(!prev.has(n)){prev.set(n,r.regionId);pending.push(n);}}return [];}
function select(id){selected=id;const r=regions.find(x=>x.regionId===id);$('name').textContent=r.displayName;$('detail').textContent=r.environment+' · 권장 Lv.'+r.recommendedLevelMin+'–'+r.recommendedLevelMax+' · 연결: '+r.connectedRegionIds.map(id=>regions.find(x=>x.regionId===id).displayName).join(' / ');drawTrail();document.querySelectorAll('.pin').forEach(b=>{b.classList.toggle('selected',b.dataset.id===id);b.setAttribute('aria-pressed',String(b.dataset.id===id));});}
function drawTrail(){const route=routeTo(selected);$('paths').replaceChildren();$('paths').setAttribute('viewBox','0 0 1000 1000');$('paths').setAttribute('preserveAspectRatio','none');for(let i=1;i<route.length;i++){const a=atlas.locations.find(x=>x.regionId===route[i-1]),b=atlas.locations.find(x=>x.regionId===route[i]);if(a.page!==page||b.page!==page)continue;const path=document.createElementNS('http://www.w3.org/2000/svg','path');const mx=(a.x+b.x)/2-(b.y-a.y)*.12,my=(a.y+b.y)/2+(b.x-a.x)*.12;path.setAttribute('d',`M${a.x*1000} ${a.y*1000} Q${mx*1000} ${my*1000} ${b.x*1000} ${b.y*1000}`);path.setAttribute('fill','none');path.setAttribute('stroke','#ffd26a');path.setAttribute('stroke-width','4');path.setAttribute('stroke-dasharray','2 9');path.setAttribute('stroke-linecap','round');$('paths').append(path);}}
function draw(){const p=atlas.pages[page];$('art').src='../Assets/Resources/'+p.resource+'.png';$('art').alt=p.title;$('map').style.width=(Math.max($('viewport').clientWidth,900)*zoom)+'px';$('scale').textContent=Math.round(zoom*100)+'%';$('in').disabled=zoom>=3;$('out').disabled=zoom<=1;$('pins').replaceChildren();for(const l of atlas.locations.filter(x=>x.page===page)){const r=regions.find(x=>x.regionId===l.regionId);const b=document.createElement('button');b.className='pin'+(l.y>.84?' bottom':'')+(l.regionId===start?' current':'');b.dataset.id=l.regionId;b.style.left=l.x*100+'%';b.style.top=l.y*100+'%';b.textContent=l.regionId===start?'●':'◇';b.setAttribute('aria-label',r.displayName);const label=document.createElement('span');label.textContent=r.displayName;b.append(label);b.onclick=()=>select(l.regionId);$('pins').append(b);}document.querySelectorAll('#pages button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===page)));select(selected);}
$('in').onclick=()=>{zoom=Math.min(3,zoom+.5);draw();};$('out').onclick=()=>{zoom=Math.max(1,zoom-.5);draw();};$('home').onclick=()=>{page=0;zoom=1;selected=start;draw();$('viewport').scrollTo(0,0);};
Promise.all(['WorldMapAtlas','RegionCatalog'].map(async name=>{const r=await fetch('../Assets/Resources/Data/'+name+'.json');if(!r.ok)throw Error(name+' HTTP '+r.status);return r.json();})).then(([a,r])=>{atlas=a;regions=r.regions;atlas.pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.title;b.onclick=()=>{page=i;zoom=1;draw();$('viewport').scrollTo(0,0);};$('pages').append(b);});draw();}).catch(e=>{$('error').textContent='저장소 루트에서 HTTP 서버로 열어 주세요. '+e.message;});
$('art').onerror=()=>{$('error').textContent='지도 이미지 로드 실패';};
</script>
</html>
